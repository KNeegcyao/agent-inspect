[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-inspect"
version = "0.1.0"
description = "Interactive step-debugger for AI agents: intercept, replay, and counterfactual-fork LLM/tool decision points."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent-Inspect contributors" }]
keywords = ["agent", "debugger", "observability", "langchain", "openai", "fork"]
dependencies = [
    "httpx>=0.27",
    "uvicorn>=0.30",
    "fastapi>=0.111",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "openai>=1.40",
]

[tool.setuptools.packages.find]
include = ["agent_inspect*"]

[tool.setuptools.package-data]
agent_inspect = ["panel/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]