name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev deps
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q
      - name: openspec validate
        run: |
          npm install -g @fission-ai/openspec
          openspec validate --all

  node-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build & test (tsc + node --test, all offline)
        working-directory: sdks/node
        run: npm ci && npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build panel
        working-directory: web
        run: npm ci && npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web deps (vite)
        working-directory: web
        run: npm ci
      - name: Build wheel with bundled panel
        run: |
          python -m pip install build
          python scripts/build_panel.py
          python -m build --wheel
      - name: Sanity-check wheel contents
        run: |
          python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'agent_inspect/panel/index.html' in names, 'wheel must bundle panel'; print('wheel carries panel: OK")
      - name: npm pack sanity (node sdk bundles panel)
        working-directory: sdks/node
        run: npm pack --dry-run
